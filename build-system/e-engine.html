</script>

<script>
/* ============================================================
   MASTER GRAMMAR APP — ENGINE
   Every widget is resolved *within its own sub-topic stack*.
   No page-global widget IDs — 49 sub-topics share this DOM.
   ============================================================ */
(function(){
'use strict';

const STORE = 'cbse_fr_master_';
const ls = {
  get(k, d){ try { const v = localStorage.getItem(STORE+k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(STORE+k, v); } catch(e){} },
  getJSON(k, d){ try { return JSON.parse(localStorage.getItem(STORE+k)) ?? d; } catch(e){ return d; } },
  setJSON(k, v){ try { localStorage.setItem(STORE+k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(STORE+k); } catch(e){} }
};

/* Accent-insensitive comparison — "etudiions" must match "étudiions". */
const norm = s => (s||'').trim().toLowerCase()
  .normalize("NFD").replace(new RegExp("[\u0300-\u036f]","g"),"")
  .replace(/[’']/g, "'")
  .replace(/\s+/g,' ');

const $  = (sel, root) => (root||document).querySelector(sel);
const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

/* ---------------- Reveal ---------------- */
const Deck = new Reveal({
  // We sync the URL ourselves (guarded). Reveal's own hash handling calls
  // history.replaceState, which throws a SecurityError on sandboxed/data: URLs
  // and rejects the init promise, taking the whole app down with it.
  hash: false,
  // Without this Reveal measures <body> (it stamps .reveal-viewport there) and
  // sizes slides to the full window, so cards run underneath the sidebar.
  // Embedded mode makes it measure its own container instead.
  embedded: true,
  controls: false,
  progress: false,
  center: false,
  transition: 'slide',
  backgroundTransition: 'none',
  width: '100%',
  height: '100%',
  margin: 0,
  minScale: 1,
  maxScale: 1,
  keyboard: true,
  viewDistance: 2,        // 440 slides — never render them all at once
  mobileViewDistance: 1,
  fragmentInURL: false
});
window.Deck = Deck;

/* ---------------- Sound (muted by default) ---------------- */
let soundOn = ls.get('sound','0') === '1';
let audioCtx = null;
function playSound(type){
  if (!soundOn) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    if (type === 'correct'){
      [523.25, 659.25, 783.99, 1046.50].forEach((f,i)=>{
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.type='sine';
        o.frequency.setValueAtTime(f, t + i*0.06);
        g.gain.setValueAtTime(0.12, t + i*0.06);
        g.gain.linearRampToValueAtTime(0.01, t + i*0.06 + 0.15);
        o.start(t + i*0.06); o.stop(t + i*0.06 + 0.15);
      });
      return;
    }
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if (type === 'wrong'){
      o.type='sawtooth'; o.frequency.setValueAtTime(140,t);
      o.frequency.linearRampToValueAtTime(90, t+0.2);
      g.gain.setValueAtTime(0.15,t); g.gain.linearRampToValueAtTime(0.01,t+0.2);
      o.start(); o.stop(t+0.2);
    } else if (type === 'slide'){
      o.type='triangle'; o.frequency.setValueAtTime(220,t);
      o.frequency.exponentialRampToValueAtTime(550, t+0.15);
      g.gain.setValueAtTime(0.08,t); g.gain.linearRampToValueAtTime(0.01,t+0.15);
      o.start(); o.stop(t+0.15);
    } else { // pop / flip
      o.type='sine'; o.frequency.setValueAtTime(450,t);
      o.frequency.exponentialRampToValueAtTime(900, t+0.08);
      g.gain.setValueAtTime(0.1,t); g.gain.linearRampToValueAtTime(0.01,t+0.08);
      o.start(); o.stop(t+0.08);
    }
  }catch(e){}
}
function refreshSoundBtn(){
  const b = $('#soundBtn');
  b.textContent = soundOn ? '🔊' : '🔇';
  b.classList.toggle('is-on', soundOn);
  b.title = soundOn ? 'Mute sound' : 'Turn sound on';
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function showToast(msg){
  const t = $('#toastNotification');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------------- Topic model, built from the DOM ---------------- */
/* Each horizontal <section> is one sub-topic stack carrying
   data-topic, data-topic-name, data-sub. Verticals are its 8 steps. */
const stacks = $$('#slidesRoot > section');
const topics = [];      // { key, name, indices:[h...], slideCount }
const topicByKey = {};
stacks.forEach((sec, h) => {
  const key = sec.dataset.topic || 'divers';
  if (!topicByKey[key]){
    topicByKey[key] = { key, name: sec.dataset.topicName || key, indices: [], slideCount: 0 };
    topics.push(topicByKey[key]);
  }
  const t = topicByKey[key];
  t.indices.push(h);
  t.slideCount += Math.max(1, sec.querySelectorAll(':scope > section').length);
});

function stackAt(h){ return stacks[h]; }
function topicOf(h){ return topicByKey[(stackAt(h)?.dataset.topic) || 'divers']; }

/* ---------------- Progress ---------------- */
let visited = ls.getJSON('visited', {});   // { topicKey: { "h.v": 1 } }
function markVisited(h, v){
  const t = topicOf(h); if (!t) return;
  if (!visited[t.key]) visited[t.key] = {};
  const k = h + '.' + v;
  if (!visited[t.key][k]){
    visited[t.key][k] = 1;
    ls.setJSON('visited', visited);
    renderTopicMenu();
    renderLeconMenu();
  }
}
function topicPct(t){
  const seen = Object.keys(visited[t.key] || {}).length;
  return Math.min(100, Math.round(seen / Math.max(1, t.slideCount) * 100));
}

/* ---------------- Topic menu ---------------- */
/* The vocabulary lessons get their own dropdown, exactly as La Lettre and Les
   Messages get their own toolbar buttons. LECON_KEYS drives both this menu and
   the Grammar menu’s hide-list, so the two can never disagree. Accueil is the
   vocabulary hub slide and is reached from the first lesson, not listed here. */
const LECON_KEYS = ['l2','l3','l4','l5','l6','l7','l8','l10'];

function renderLeconMenu(){
  const menu = $('#leconsMenu');
  if (!menu) return;
  menu.innerHTML = '';
  LECON_KEYS.forEach(key => {
    const t = topicByKey[key];
    if (!t) return;
    const b = document.createElement('button');
    b.className = 'topic-menu-item';
    b.innerHTML = `<span class="tm-num">${key.slice(1)}</span><span>${t.name}</span>` +
                  `<span class="tm-pct">${topicPct(t)}%</span>`;
    b.addEventListener('click', () => {
      Deck.slide(t.indices[0], 0);
      menu.classList.remove('open');
    });
    menu.appendChild(b);
  });
}

function renderTopicMenu(){
  const menu = $('#topicMenu');
  menu.innerHTML = '';
  /* La Lettre is reached from the toolbar “Letters” button and the sidebar, so it
     is redundant here. MENU_HIDE only filters this dropdown — the topic, its
     slides and every other entry point are untouched. Numbering below uses the
     filtered index, so the remaining items renumber automatically. */
  const MENU_HIDE = { lettre: 1, messages: 1, accueil: 1 };
  LECON_KEYS.forEach(k => { MENU_HIDE[k] = 1; });
  topics.filter(t => !MENU_HIDE[t.key]).forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'topic-menu-item';
    b.innerHTML = `<span class="tm-num">${i+1}</span><span>${t.name}</span><span class="tm-pct">${topicPct(t)}%</span>`;
    b.addEventListener('click', () => {
      Deck.slide(t.indices[0], 0);
      menu.classList.remove('open');
    });
    menu.appendChild(b);
  });
}

/* ---------------- Sidebar ---------------- */
/* Sidebar accordion state. null = follow the current slide; a string = the user
   explicitly opened that chapter/letter; '' = the user explicitly closed it. */
const sbOpen = { group: null, item: null };
/* Sidebar step labels: English for every topic EXCEPT La Lettre, whose steps
   are already English. Lookup normalises apostrophes (’ vs ') because the two
   forms are mixed across the content files. */
const SB_STEP_EN = {"Description":"Description","Formation":"How to Form","Exceptions":"Exceptions","Pièges":"Common Mistakes","Exemples":"Examples","En contexte":"In Context","Pratique QCM":"MCQ Practice","Pratique — à compléter":"Fill-in-the-blanks Practice","Usages":"Usage","Mémo visuel":"Visual Memory Aid","En application":"In Practice","Galerie visuelle":"Visual Gallery","Tableau de référence":"Reference Table","Examen CBSE":"CBSE Exam","Check-list":"Checklist","Cartes mémoire":"Flashcards","Bienvenue":"Welcome","Les 8 étapes":"The 8 Steps","Les 3 groupes":"The 3 Groups","La ligne du temps":"Timeline","Laboratoire de conjugaison":"Conjugation Lab","Examen CBSE — tous les temps":"CBSE Exam — All Tenses","Check-list de l’examen":"Exam Checklist","Arbre de décision":"Decision Tree","Pourquoi mélanger":"Why Mix Them","Identifier le sujet":"Identify the Topic","Mélange 1 — QCM":"Mixed 1 — MCQ","Mélange 2 — à compléter":"Mixed 2 — Fill in the Blanks","Les pièges les plus coûteux":"The Costliest Traps","Stratégie de l’examen":"Exam Strategy","Bonne chance":"Good Luck","Usages · La routine":"Usage: Daily Routine","Usages · Maintenant":"Usage: Happening Now","Usages · Vérités générales":"Usage: General Truths","Usages · Les instructions":"Usage: Instructions","Usages · Conseils & invitations":"Usage: Advice & Invitations","Usages · La description":"Usage: Description & Background","Usages · L’habitude passée":"Usage: Past Habits","Usages · L’action interrompue":"Usage: Interrupted Action","Usages · L’événement terminé":"Usage: A Completed Event","Usages · La suite d’actions":"Usage: A Sequence of Actions","Usages · Le résultat présent":"Usage: Present Result","Usages · Le passé du passé":"Usage: The Past Before the Past","Usages · Le regret & l’explication":"Usage: Regret & Explanation","Usages · Projets & prédictions":"Usage: Plans & Predictions","Usages · Promesses & conseils":"Usage: Promises & Advice","Usages · Après quand & dès que":"Usage: After quand & dès que","Usages · Fini avant un moment futur":"Usage: Finished Before a Future Moment","Usages · La supposition":"Usage: Supposition","Usages · La politesse":"Usage: Politeness","Usages · L’hypothèse":"Usage: Hypotheses","Usages · Conseils & nouvelles":"Usage: Advice & News","Usages · La routine quotidienne":"Usage: Daily Routine","Usages · Le sens réciproque":"Usage: Reciprocal Meaning","Usages · Volonté & Désir":"Usage: Will & Desire","Usages · L’Émotion":"Usage: Emotion","Usages · La Nécessité":"Usage: Necessity","Usages · Doute & Négation":"Usage: Doubt & Negation","Usages · Les conjonctions déclencheurs":"Usage: Trigger Conjunctions","Usages · Refuser & démentir":"Usage: Refusing & Denying","Usages · La fréquence zéro":"Usage: Never — Zero Frequency","Usages · Ce qui a changé":"Usage: What Has Changed","Usages · Zéro chose":"Usage: Nothing — Zero Things","Usages · Zéro personne":"Usage: Nobody — Zero People","Usages · La restriction":"Usage: Only — Restriction","Usages · Refuser deux choses":"Usage: Refusing Two Things","Usages · Éviter la répétition":"Usage: Avoiding Repetition","Usages · À qui on parle":"Usage: Who You Speak To","Usages · Le lieu où l’on va":"Usage: Where You Go","Usages · Les quantités":"Usage: Quantities","Usages · Insister & après une préposition":"Usage: Emphasis & After a Preposition","Usages · Deux pronoms ensemble":"Usage: Two Pronouns Together","Usages · Décrire qui fait l’action":"Usage: Describing Who Acts","Usages · Décrire ce qu’on subit":"Usage: Describing What Receives","Usages · Le lieu et le moment":"Usage: Place & Time","Usages · Quand le verbe demande DE":"Usage: When the Verb Needs DE","Usages · Après une préposition":"Usage: After a Preposition","Usages · Rapporter une affirmation":"Usage: Reporting a Statement","Usages · Rapporter une question":"Usage: Reporting a Question","Usages · Rapporter un ordre":"Usage: Reporting an Order","Usages · Quand le verbe introducteur est au passé":"Usage: When the Reporting Verb Is Past","Usages · Les repères de temps changent":"Usage: Time Markers Change","Usages · La question passe-partout":"Usage: The All-Purpose Question","Usages · Le registre formel":"Usage: The Formal Register","Usages · Une personne ou une chose":"Usage: A Person or a Thing","Usages · Demander les circonstances":"Usage: Asking About Circumstances","Usages · Choisir dans un ensemble":"Usage: Choosing From a Set","Usages · Demander une quantité":"Usage: Asking How Many","Usages · Présenter ce qui est à soi":"Usage: Saying What Is Yours","Usages · Comparer sans répéter":"Usage: Comparing Without Repeating","Usages · Montrer du doigt":"Usage: Pointing at Things","Usages · Celui de, celui qui":"Usage: celui de, celui qui","Usages · Celui-ci ou celui-là":"Usage: celui-ci or celui-là"};
const sbNorm = s => String(s || '').replace(/[’ʼ`]/g, "'");
const SB_STEP_LOOKUP = {};
Object.keys(SB_STEP_EN).forEach(k => { SB_STEP_LOOKUP[sbNorm(k)] = SB_STEP_EN[k]; });
function stepLabel(sec, st, v){
  const raw = st.dataset.step || ('Step ' + (v + 1));
  if (sec.dataset.topic === 'lettre') return raw;
  return SB_STEP_LOOKUP[sbNorm(raw)] || raw;
}
function renderSidebar(){
  const sb = $('#sidebar');
  const idx = Deck.getIndices();
  const t = topicOf(idx.h);
  if (!t){ sb.innerHTML = ''; return; }

  let html = `<div class="sb-title">${t.name}</div>`;
  t.indices.forEach(h => {
    const sec = stackAt(h);
    const label = sec.dataset.sub || sec.dataset.topicName || 'Section';
    const active = (h === idx.h);
    html += `<button class="sb-item${active ? ' active' : ''}" data-h="${h}" data-v="0">${label}</button>`;
    if (!active) return;

    const steps = $$(':scope > section', sec);
    const grouped = steps.some(s => s.dataset.group);

    /* Flat list — every stack except Model Letters. Unchanged behaviour. */
    if (!grouped){
      steps.forEach((st, v) => {
        const nm = stepLabel(sec, st, v);
        html += `<button class="sb-item step${v === idx.v ? ' active' : ''}" data-h="${h}" data-v="${v}">${v+1}. ${nm}</button>`;
      });
      return;
    }

    /* Accordion — Chapter > Letter > parts. Model Letters is one stack of 68
       vertical slides, which as a flat list is 68 unusable rows. */
    const cur = steps[idx.v] || {};
    const curGroup = (cur.dataset || {}).group || null;
    const curItem  = (cur.dataset || {}).item  || null;
    const openGroup = sbOpen.group !== null ? sbOpen.group : curGroup;
    const openItem  = sbOpen.item  !== null ? sbOpen.item  : curItem;

    const groups = [];
    steps.forEach((st, v) => {
      const g = st.dataset.group || 'Autres';
      const it = st.dataset.item || '';
      let G = groups.find(x => x.name === g);
      if (!G){ G = { name: g, items: [] }; groups.push(G); }
      let I = G.items.find(x => x.name === it);
      if (!I){ I = { name: it, steps: [] }; G.items.push(I); }
      I.steps.push({ v, name: st.dataset.step || ('Step ' + (v+1)) });
    });

    groups.forEach(G => {
      const gOpen = (G.name === openGroup);
      html += `<button class="sb-item sb-group${gOpen ? ' open' : ''}${G.name === curGroup ? ' here' : ''}" data-group="${G.name}">${G.name}</button>`;
      if (!gOpen) return;
      G.items.forEach(I => {
        const iOpen = (I.name === openItem);
        html += `<button class="sb-item sb-group sb-sub${iOpen ? ' open' : ''}${I.name === curItem ? ' here' : ''}" data-group="${G.name}" data-item="${I.name}">${I.name}</button>`;
        if (!iOpen) return;
        I.steps.forEach(s => {
          // drop the "Ch 3 — " prefix; the chapter is already the row above
          const nm = s.name.replace(/^.*?\u2014\s*/, '');
          html += `<button class="sb-item step part${s.v === idx.v ? ' active' : ''}" data-h="${h}" data-v="${s.v}">${nm}</button>`;
        });
      });
    });
  });
  html += `<div class="sb-divider"></div><div class="sb-title">Progress — ${topicPct(t)}%</div>`;
  sb.innerHTML = html;

  /* Only rows with a data-v navigate. Chapter and letter rows share the .sb-item
     class purely for styling, so this selector is what keeps them inert. */
  $$('.sb-item[data-v]', sb).forEach(b => b.addEventListener('click', () => {
    Deck.slide(parseInt(b.dataset.h,10), parseInt(b.dataset.v,10));
  }));
  /* Toggle rows only open/close. They must NOT move the deck — a toggle that also
     jumped the slide would make the accordion unusable during a live lesson. */
  $$('.sb-group', sb).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.item){
      sbOpen.group = b.dataset.group;
      sbOpen.item = (sbOpen.item === b.dataset.item) ? '' : b.dataset.item;
    } else {
      sbOpen.group = (sbOpen.group === b.dataset.group) ? '' : b.dataset.group;
      sbOpen.item = null;
    }
    renderSidebar();
  }));
}

/* ---------------- HUD ---------------- */
function updateHud(){
  const idx = Deck.getIndices();
  const sec = stackAt(idx.h);
  if (!sec) return;
  const t = topicOf(idx.h);
  const steps = sec.querySelectorAll(':scope > section').length || 1;
  const sub = sec.dataset.sub || '';
  const stepName = (sec.querySelectorAll(':scope > section')[idx.v]?.dataset.step) || '';

  $('#slideCounter').textContent =
    `${t ? t.name : ''}${sub ? ' · ' + sub : ''} · ${idx.v+1}/${steps}${stepName ? ' — ' + stepName : ''}`;

  $('#prevBtn').disabled = (idx.h === 0 && idx.v === 0);
  $('#nextBtn').disabled = Deck.isLastSlide();
  $('#topicProgress').style.width = (Deck.getProgress()*100).toFixed(1) + '%';

  markVisited(idx.h, idx.v);
  renderSidebar();
}

/* ---------------- Themes ---------------- */
const DARK = ['theme-slate','theme-cyber'];
function applyTheme(name){
  // classList, never body.className — that used to wipe editing-active / mode-*
  Array.from(document.body.classList)
    .filter(c => c.startsWith('theme-'))
    .forEach(c => document.body.classList.remove(c));
  document.body.classList.add(name);
  ls.set('theme', name);
  const sel = $('#themeSelect'); if (sel) sel.value = name;
  $('#lightBtn').textContent = DARK.includes(name) ? '🌙' : '☀️';
}
function toggleLight(){
  const cur = Array.from(document.body.classList).find(c => c.startsWith('theme-')) || 'theme-slate';
  if (DARK.includes(cur)) applyTheme(ls.get('lightTheme','theme-classic'));
  else { ls.set('lightTheme', cur); applyTheme(ls.get('darkTheme','theme-slate')); }
}

/* ---------------- Teacher / Student mode ---------------- */
function applyMode(mode){
  document.body.classList.remove('mode-teacher','mode-student');
  document.body.classList.add(mode);
  ls.set('mode', mode);
  const b = $('#modeBtn');
  b.textContent = mode === 'mode-teacher' ? '👩‍🏫 Teacher' : '🎓 Student';
  b.classList.toggle('is-on', mode === 'mode-student');
  // Teacher mode: questions stay visible so the class answers aloud, but nothing auto-grades.
  const teaching = (mode === 'mode-teacher');
  $$('.quiz-container').forEach(c => {
    $$('.option-btn', c).forEach(x => { if (!x.dataset.locked) x.disabled = teaching; });
    $$('.fib-input',  c).forEach(x => { x.disabled = teaching; });
  });
}
function toggleMode(){
  applyMode(document.body.classList.contains('mode-teacher') ? 'mode-student' : 'mode-teacher');
}

/* ---------------- Quiz + fill-in-the-blank, scoped per container ---------------- */
function initQuizContainer(container){
  const mcqRows = $$('.question-row', container).filter(r => r.querySelector('.option-btn'));
  const fibs    = $$('.fib-input', container);
  const total   = mcqRows.length + fibs.length;
  if (!total) return;

  let answered = 0, score = 0;
  const fill  = $('.quiz-progress-fill', container);
  const disp  = $('.score-display', container);

  function paint(){
    if (fill) fill.style.width = (answered/total*100) + '%';
    if (disp) disp.textContent = `Score : ${score} / ${total}`;
    if (answered === total && score/total >= 0.7){
      setTimeout(()=>{ burstConfetti(); burstFireworks(); showToast(`🎉 Well done! ${score} / ${total}`); }, 350);
    }
  }

  mcqRows.forEach(row => {
    const correct = row.dataset.answer || '';
    const btns = $$('.option-btn', row);
    btns.forEach(btn => btn.addEventListener('click', () => {
      if (row.classList.contains('answered') || btn.disabled) return;
      row.classList.add('answered'); answered++;
      const ok = norm(btn.textContent) === norm(correct);
      if (ok){ btn.classList.add('correct'); score++; playSound('correct'); burstFireworks(); burstConfetti(); }
      else {
        btn.classList.add('wrong'); playSound('wrong');
        btns.forEach(b => { if (norm(b.textContent) === norm(correct)) b.classList.add('correct'); });
      }
      btns.forEach(b => { b.disabled = true; b.dataset.locked = '1'; });
      paint();
    }));
  });

  fibs.forEach(inp => {
    const verdict = inp.parentElement.querySelector('.fib-verdict');
    function check(){
      if (inp.dataset.done || inp.disabled) return;
      const accepted = (inp.dataset.answer || '').split('|').map(norm);
      const ok = accepted.includes(norm(inp.value));
      inp.dataset.done = '1'; inp.classList.add(ok ? 'correct' : 'wrong');
      answered++; if (ok) score++;
      if (verdict){
        verdict.className = 'fib-verdict ' + (ok ? 'ok' : 'no');
        verdict.textContent = ok ? '✓' : '✗ ' + (inp.dataset.answer||'').split('|')[0];
      }
      playSound(ok ? 'correct' : 'wrong');
      if (ok) burstConfetti();
      paint();
    }
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
    inp.addEventListener('focus', () => { container.dataset.lastInput = fibs.indexOf(inp); });
    inp._check = check;
  });

  const checkBtn = $('.fib-check', container);
  if (checkBtn) checkBtn.addEventListener('click', () => fibs.forEach(i => i._check && i._check()));

  const revealBtn = $('.reveal-answers', container);
  if (revealBtn) revealBtn.addEventListener('click', () => {
    mcqRows.forEach(row => {
      const correct = row.dataset.answer || '';
      $$('.option-btn', row).forEach(b => { if (norm(b.textContent) === norm(correct)) b.classList.add('correct'); });
    });
    fibs.forEach(inp => {
      const v = inp.parentElement.querySelector('.fib-verdict');
      if (v){ v.className = 'fib-verdict ok'; v.textContent = '→ ' + (inp.dataset.answer||'').split('|')[0]; }
    });
  });

  const retry = $('.retry-btn', container);
  if (retry) retry.addEventListener('click', () => {
    answered = 0; score = 0;
    const teaching = document.body.classList.contains('mode-teacher');
    mcqRows.forEach(row => {
      row.classList.remove('answered');
      $$('.option-btn', row).forEach(b => {
        b.classList.remove('correct','wrong'); delete b.dataset.locked; b.disabled = teaching;
      });
    });
    fibs.forEach(inp => {
      delete inp.dataset.done; inp.value = ''; inp.classList.remove('correct','wrong');
      const v = inp.parentElement.querySelector('.fib-verdict'); if (v){ v.textContent=''; v.className='fib-verdict'; }
    });
    paint();
  });

  // Accent helper — students on laptops cannot type é è ê à ç
  $$('.accent-key', container).forEach(k => k.addEventListener('click', () => {
    const i = parseInt(container.dataset.lastInput || '0', 10);
    const inp = fibs[i]; if (!inp || inp.disabled) return;
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0,s) + k.textContent + inp.value.slice(e);
    inp.focus(); inp.setSelectionRange(s+1, s+1);
  }));

  paint();
}

/* ---------------- Flip cards (delegated) + spaced repetition ---------------- */
let known = ls.getJSON('known', {});
function cardKey(card){

/* ---------------- Formula lab, scoped by data attributes ---------------- */
function initLabs(){
  $$('.formula-lab').forEach(lab => {
    const data = JSON.parse(lab.dataset.lab || '{}');
    const pronouns = JSON.parse(lab.dataset.pronouns || '[]');
    const tbody = $('.lab-body', lab);
    const stemEl = $('.lab-stem', lab);
    const verbEl = $('.lab-verb', lab);
    const eqEl   = $('.lab-eq', lab);
    let verb = Object.keys(data)[0];
    let tense = verb ? Object.keys(data[verb]).filter(k => k !== 'stem')[0] : null;

    function render(){
      if (!verb || !tense || !data[verb]) return;
      const forms = data[verb][tense] || [];
      if (verbEl) verbEl.textContent = verb;
      if (stemEl) stemEl.textContent = data[verb].stem || '—';
      if (eqEl)   eqEl.textContent   = (pronouns[0] || '') + ' ' + (forms[0] || '');
      if (tbody){
        tbody.innerHTML = '';
        forms.forEach((f, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td><strong>${pronouns[i] || ''}</strong></td><td class="key-form">${f}</td>`;
          tbody.appendChild(tr);
        });
      }
      $$('.verb-select-btn', lab).forEach(b => b.classList.toggle('is-on', b.dataset.verb === verb));
      $$('.tense-select-btn', lab).forEach(b => b.classList.toggle('is-on', b.dataset.tense === tense));
    }
    $$('.verb-select-btn', lab).forEach(b => b.addEventListener('click', () => {
      verb = b.dataset.verb;
      if (!data[verb][tense]) tense = Object.keys(data[verb]).filter(k => k !== 'stem')[0];
      playSound('pop'); render();
    }));
    $$('.tense-select-btn', lab).forEach(b => b.addEventListener('click', () => {
      tense = b.dataset.tense; playSound('pop'); render();
    }));
    render();
  });
}

/* ---------------- Search ---------------- */
let searchIndex = [];
function buildSearchIndex(){
  stacks.forEach((sec, h) => {
    const topic = sec.dataset.topicName || '';
    const sub   = sec.dataset.sub || '';
    $$(':scope > section', sec).forEach((st, v) => {
      const step = st.dataset.step || '';
      const bits = [];
      $$('h1,h2,h3,.highlight,.example-text,.key-form,.q-text', st).forEach(el => bits.push(el.textContent));
      searchIndex.push({ h, v, topic, sub, step, hay: norm(topic+' '+sub+' '+step+' '+bits.join(' ')) });
    });
  });

  /* LETTERDATA search — the module collapses ~100 former slides into one, so its
     topics are indexed explicitly or letter content becomes unfindable. */
  try{
    if (typeof LETTERDATA !== 'undefined'){
      const mod = stacks.findIndex(x => x.dataset.sub === 'Le module');
      if (mod >= 0){
        LETTERDATA.forEach(g => g.topics.forEach(t => {
          const bits = [t.en.title, t.fr.title, g.group, t.lecon || ''];
          if (t.letter){ bits.push(t.letter.fr.paras.join(' '), t.prompt.fr); }
          else if (t.fr.paras){ bits.push(t.fr.paras.join(' ')); }
          (t.bank||[]).forEach(b => bits.push(b[0]));
          (t.vocab||[]).forEach(b => bits.push(b[0]));
          searchIndex.push({ h: mod, v: 0, topic: 'La Lettre (Section B)', sub: g.group,
                             step: t.en.title, hay: norm(bits.join(' ')) });
        }));
      }
    }
  }catch(e){ console.warn('Letter search index:', e); }
}
function runSearch(q){
  const box = $('#searchResults');
  const nq = norm(q);
  if (!nq){ box.innerHTML = '<div class="search-empty">Tapez pour rechercher…</div>'; return; }
  const hits = searchIndex.filter(e => e.hay.includes(nq)).slice(0, 40);
  if (!hits.length){ box.innerHTML = '<div class="search-empty">Aucun résultat</div>'; return; }
  box.innerHTML = hits.map((e,i) =>
    `<button class="search-hit${i===0?' sel':''}" data-h="${e.h}" data-v="${e.v}">
       <span class="sh-path">${e.topic} › ${e.sub}</span>${e.step}
     </button>`).join('');
  $$('.search-hit', box).forEach(b => b.addEventListener('click', () => {
    Deck.slide(parseInt(b.dataset.h,10), parseInt(b.dataset.v,10));
    $('#searchModal').classList.remove('open');
  }));
}
function openSearch(){
  $('#searchModal').classList.add('open');
  const i = $('#searchInput'); i.value = ''; runSearch(''); setTimeout(()=>i.focus(), 30);
}

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const ambC = $('#ambientParticlesCanvas'), ambX = ambC.getContext('2d');
const fwC  = $('#fireworksCanvas'),        fwX  = fwC.getContext('2d');
const cfC  = $('#confettiCanvas'),         cfX  = cfC.getContext('2d');
let amb = [], fw = [], cf = [], fxRunning = false;

function sizeCanvases(){
  [ambC, fwC, cfC].forEach(c => { c.width = window.innerWidth; c.height = window.innerHeight; });
}
/* In embedded mode Reveal does NOT re-layout on window resize, so slides keep
   their old width when the projector/window changes. Drive it ourselves. */
let layoutTimer = null;
function relayout(){
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(() => { try { Deck.layout(); } catch(e){} try { refitLetters(); } catch(e){} }, 80);
}
window.addEventListener('resize', () => { sizeCanvases(); relayout(); });
document.addEventListener('fullscreenchange', relayout);
/* The reliable trigger: fires whenever the deck's own box changes — window
   resize, sidebar toggle, fullscreen, or the <1024px media query flipping —
   without relying on a window resize event actually being delivered. */
if (window.ResizeObserver){
  new ResizeObserver(relayout).observe(document.querySelector('.reveal'));
}
sizeCanvases();
for (let i=0;i<40;i++) amb.push({
  x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
  r:Math.random()*2+1, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3
});
function themeColors(){
  const cs = getComputedStyle(document.body);
  return ['--heading-color','--crimson','--gold','--green','--purple']
    .map(v => cs.getPropertyValue(v).trim() || '#002395');
}
function burstConfetti(){
  if (reduced) return;
  const cols = themeColors();
  for (let i=0;i<60;i++) cf.push({
    x:window.innerWidth/2, y:window.innerHeight/2,
    vx:(Math.random()-.5)*10, vy:(Math.random()-1.2)*10,
    size:Math.random()*6+4, color:cols[(Math.random()*cols.length)|0], life:100
  });
  startFX();
}
function burstFireworks(){
  if (reduced) return;
  const cols = themeColors();
  const cx = window.innerWidth/2, cy = window.innerHeight/2.5;
  for (let i=0;i<50;i++){
    const a = (Math.PI*2*i)/50, sp = Math.random()*5+3;
    fw.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, color:cols[(Math.random()*cols.length)|0], life:60 });
  }
  startFX();
}
function frame(){
  if (!fxRunning) return;
  ambX.clearRect(0,0,ambC.width,ambC.height);
  ambX.fillStyle = getComputedStyle(document.body).getPropertyValue('--particle-color') || 'rgba(0,35,149,.3)';
  amb.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if (p.x<0||p.x>ambC.width) p.vx*=-1;
    if (p.y<0||p.y>ambC.height) p.vy*=-1;
    ambX.beginPath(); ambX.arc(p.x,p.y,p.r,0,Math.PI*2); ambX.fill();
  });
  fwX.clearRect(0,0,fwC.width,fwC.height);
  fw = fw.filter(p => p.life>0);
  fw.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.life--;
    fwX.globalAlpha = Math.max(p.life/60,0); fwX.fillStyle = p.color;
    fwX.beginPath(); fwX.arc(p.x,p.y,2.5,0,Math.PI*2); fwX.fill(); fwX.globalAlpha = 1;
  });
  cfX.clearRect(0,0,cfC.width,cfC.height);
  cf = cf.filter(p => p.life>0);
  cf.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.life--;
    cfX.fillStyle = p.color; cfX.fillRect(p.x,p.y,p.size,p.size);
  });
  requestAnimationFrame(frame);
}
function startFX(){ if (!fxRunning && !reduced){ fxRunning = true; requestAnimationFrame(frame); } }
function stopFX(){ fxRunning = false; }
document.addEventListener('visibilitychange', () => document.hidden ? stopFX() : startFX());

const speechOK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
let frVoice = null;
function pickFrenchVoice(){
  if (!speechOK) return;
  const vs = speechSynthesis.getVoices() || [];
  frVoice = vs.find(v => /fr-FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
}
if (speechOK){ pickFrenchVoice(); speechSynthesis.onvoiceschanged = pickFrenchVoice; }
function speakFrench(text, btn){
  if (!speechOK || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = (window.__frRate || 0.92); if (frVoice) u.voice = frVoice;
    if (btn){ btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
    speechSynthesis.speak(u);
  } catch(e){}
}
/* Strip glosses / arrows so only the French is read aloud */
function frenchTextOf(el){
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.gloss, .q-tag, .audio-btn').forEach(n => n.remove());
  return (clone.textContent || '').replace(/→.*$/,'').replace(/\s+/g,' ').trim();

/* ---------------- Interactive Tense Timeline ---------------- */
function initTimeline(){
  const hero = $('.tl-hero'); if (!hero) return;
  let data = {};
  try { data = JSON.parse(hero.dataset.tl || '{}'); } catch(e){ console.warn('Timeline data parse failed', e); return; }
  let verb = Object.keys(data)[0]; if (!verb) return;
  const detail = $('.tl-detail', hero);

  function renderNodes(){
    const set = data[verb] || {};
    $$('.tl-node', hero).forEach(node => {
      const k = node.dataset.tense; const d = set[k]; if (!d) return;
      const fEl = $('.tl-formula', node); if (fEl) fEl.textContent = d.formula;
      const eEl = $('.tl-ex', node); if (eEl) eEl.textContent = d.ex;
    });
    // moods also carry per-verb example text on their button title
    $$('.tl-mood', hero).forEach(m => { const d = set[m.dataset.tense]; if (d) m.title = d.ex + ' — ' + d.gloss; });
  }
  function showDetail(k){
    const d = (data[verb] || {})[k]; if (!d || !detail) return;
    $$('.tl-node', hero).forEach(n => n.classList.toggle('active', n.dataset.tense === k));
    detail.innerHTML =
      `<h3>${d.fr} <span style="color:var(--text-muted);font-weight:600;font-size:.75em;">(${d.en})</span></h3>` +
      `<span class="tl-formula" style="font-size:.8rem;">${d.formula}</span>` +
      `<p class="tl-d-ex">${d.ex}</p>` +
      `<span class="gloss">${d.gloss}</span>`;
    injectAudioButtons();
  }
  $$('.tl-node', hero).forEach(node => node.addEventListener('click', () => showDetail(node.dataset.tense)));
  $$('.tl-verb-btn', hero).forEach(b => b.addEventListener('click', () => {
    verb = b.dataset.verb;
    $$('.tl-verb-btn', hero).forEach(x => x.classList.toggle('is-on', x === b));
    renderNodes();
    const active = $('.tl-node.active', hero) || $('.tl-node', hero);
    if (active) showDetail(active.dataset.tense);
    playSound('pop');
  }));
  $$('.tl-mood', hero).forEach(m => m.addEventListener('click', () => {
    m.classList.toggle('active');
    const k = m.dataset.tense;
    if (m.classList.contains('active')) showDetail(k);
  }));
  renderNodes();
  const first = $('.tl-node', hero);
  if (first) showDetail(first.dataset.tense);
  /* Optional GSAP flourish (the pure-CSS layout is already complete without it).
     Three rules here, each guarding a way the nodes could end up invisible:
       1. RUN ONCE. This is called from initTimeline AND from boot(). gsap.from()
          infers its END value from the element's current opacity, so a second
          call landing mid-tween would record end-opacity ~0 and animate 0 -> 0,
          leaving every tense permanently faint.
       2. fromTo with an EXPLICIT opacity:1 end — never inferred — plus
          clearProps so the inline style is removed and CSS governs afterwards.
       3. If anything throws, strip the inline styles rather than leaving the
          nodes hidden. A missing flourish is fine; invisible text is not. */
  let tlAnimated = false;
  const tlReveal = () => $$('.tl-node', hero).forEach(n => { n.style.opacity = ''; n.style.transform = ''; });
  window.__enhanceTimeline = () => {
    if (typeof gsap === 'undefined' || tlAnimated) return;
    tlAnimated = true;
    const nodes = $$('.tl-node', hero);
    if (!nodes.length) return;
    try {
      gsap.fromTo(nodes,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: .5, stagger: .06, ease: 'back.out(1.6)', clearProps: 'opacity,transform' });
    } catch(e){ tlReveal(); }
    /* last-resort net: whatever happened above, the text must be readable */
    setTimeout(tlReveal, 1500);
  };
  if (typeof gsap !== 'undefined') window.__enhanceTimeline();
}

const CJ_COMPOUND = ['pc', 'pqp', 'futurAnt', 'condPasse'];
function cjSplit(form, tense){
  // compound tenses show auxiliary + participle whole — the ending sits on the auxiliary
  if (CJ_COMPOUND.indexOf(tense) >= 0) return [form, ''];
  const ends = CJ_ENDINGS[tense] || [];
  for (const e of ends){ if (form.length > e.length && form.endsWith(e)) return [form.slice(0, -e.length), e]; }
  for (const e of ends){ if (form.endsWith(e)) return [form.slice(0, -e.length), e]; }
  return [form, ''];
}
function cjPron(pron, form){
  if (pron === 'je' && /^[aeiouâàéèêhîïôœù]/i.test(form)) return "j'";
  return pron + ' ';
}
function famLabel(id){ const f = CJ_FAMS.find(x => x[0] === id); return f ? f[1] : id; }

/* ---- the all-tenses card — shared by the Lab and the Family Navigator ---- */
function cjRenderAllTenses(v, head, grid, hidden){
  if (!head || !grid) return;
  hidden = hidden || {};
  if (!v){ head.innerHTML = ''; grid.innerHTML = ''; return; }
  head.innerHTML =
    `<span class="cj-inf">${v.inf}</span><span class="cj-en">${v.en}</span>` +
    `<span class="cj-tag">Group ${v.group}</span>` +
    `<span class="cj-tag" style="background:var(--heading-color)">${famLabel(v.fam)}</span>` +
    (v.model && v.model !== '—' ? `<span class="cj-tag" style="background:var(--purple)">model: ${v.model}</span>` : '');

  grid.innerHTML = '';
  CJ_ALL_TENSES.forEach(([id, label, gloss]) => {
    const forms = v.t[id];
    if (!forms || !forms.length) return;
    const blk = document.createElement('div');
    blk.className = 'cj-block'; blk.dataset.t = id;
    if (hidden[id]) blk.style.display = 'none';
    const isImp = (id === 'imperatif');
    const rows = forms.map((f, i) => {
      if (!f) return `<tr><td>${isImp ? CJ_IMP_PRON[i] : CJ_PRON[i]}</td><td style="color:var(--text-muted)">—</td></tr>`;
      const [stem, end] = cjSplit(f, id);
      const who = isImp ? CJ_IMP_PRON[i] : cjPron(CJ_PRON[i], f);
      return `<tr><td>${who}</td><td><span class="cj-stem">${stem}</span><span class="cj-end">${end}</span></td></tr>`;
    }).join('');
    blk.innerHTML = `<div class="cj-block-h">${label}<span>${gloss}</span></div>` +
                    `<table class="cj-table"><tbody>${rows}</tbody></table>`;
    grid.appendChild(blk);
  });
}


function initConjLab(container){
  if (!container) return;
  // Prefer the full 500-verb dataset; fall back to the curated table if absent.
  const DATA = (typeof VERBS500 !== 'undefined' && VERBS500) ? VERBS500 : null;
  const src = DATA || CONJ;
  const isFull = !!DATA;
  const LIST_CAP = 60;                       // never paint 500 buttons at once

  let fam = 'all', verb = isFull ? 'parler' : 'parler', search = '', hidden = {};
  let vfamFilter = null;   // fine sub-family filter set by the Family Navigator
  const famsWrap  = $('.cj-fams', container),  tensesWrap = $('.cj-tenses', container),
        listWrap  = $('.cj-verblist', container), head = $('.cj-head', container),
        grid      = $('.cj-allgrid', container), countEl = $('.cj-count', container),
        searchInput = $('.cj-search', container);

  const rec = k => {                          // normalise both shapes to one
    const v = src[k]; if (!v) return null;
    return isFull ? v : { inf: v.inf, en: v.en, group: v.group, fam: v.fam, model: '—', t: v };
  };

  /* ---- family chips ---- */
  CJ_FAMS.forEach(([id, label]) => {
    const b = document.createElement('button');
    b.className = 'cj-fam-btn' + (id === 'all' ? ' is-on' : ''); b.dataset.fam = id; b.textContent = label;
    b.addEventListener('click', () => {
      fam = id; $$('.cj-fam-btn', container).forEach(x => x.classList.toggle('is-on', x === b)); renderList();
    });
    famsWrap.appendChild(b);
  });

  /* ---- tense chips now SHOW/HIDE blocks (all are visible by default) ---- */
  CJ_ALL_TENSES.forEach(([id, label]) => {
    const b = document.createElement('button');
    b.className = 'cj-tense-btn is-on'; b.dataset.ctense = id; b.textContent = label;
    b.addEventListener('click', () => {
      hidden[id] = !hidden[id];
      b.classList.toggle('is-on', !hidden[id]);
      const blk = $('.cj-block[data-t="' + id + '"]', container);
      if (blk) blk.style.display = hidden[id] ? 'none' : '';
      playSound('pop');
    });
    tensesWrap.appendChild(b);
  });

  /* ---- search, debounced (500 verbs) ---- */
  let sTimer = null;
  if (searchInput) searchInput.addEventListener('input', () => {
    clearTimeout(sTimer);
    sTimer = setTimeout(() => { search = norm(searchInput.value); renderList(); }, 160);
  });

  function matches(k){
    const v = rec(k); if (!v) return false;
    if (fam !== 'all' && v.fam !== fam) return false;
    if (vfamFilter && !vfamFilter(v)) return false;
    if (!search) return true;
    return norm(v.inf).includes(search) || norm(v.en).includes(search);
  }

  function renderList(){
    const all = Object.keys(src).filter(matches);
    listWrap.innerHTML = '';
    if (!all.length){
      listWrap.innerHTML = '<span style="color:var(--text-muted);font-size:.85rem;padding:4px;">No verb matches — try another spelling.</span>';
      if (countEl) countEl.textContent = '0 verbs';
      return;
    }
    if (!all.includes(verb)) verb = all[0];
    const shown = all.slice(0, LIST_CAP);
    shown.forEach(k => {
      const b = document.createElement('button');
      b.className = 'cj-verb-btn' + (k === verb ? ' is-on' : ''); b.dataset.verb = k; b.textContent = rec(k).inf;
      b.addEventListener('click', () => {
        verb = k; $$('.cj-verb-btn', container).forEach(x => x.classList.toggle('is-on', x === b));
        renderCard(); playSound('pop');
      });
      listWrap.appendChild(b);
    });
    if (countEl) countEl.textContent = all.length + ' verb' + (all.length > 1 ? 's' : '') +
      (all.length > LIST_CAP ? ' — showing first ' + LIST_CAP + ', keep typing to narrow' : '');
    renderCard();
  }

  /* ---- the all-tenses card (shared renderer) ---- */
  function renderCard(){ cjRenderAllTenses(rec(verb), head, grid, hidden); }

  /* additive hook: the Family Navigator sets a fine sub-family filter.
     Lives on the element, not on window, so 112 widgets stay independent. */
  container.__setVFam = function(subId){
    const sub = (typeof vfSubById === "function") ? vfSubById(subId) : null;
    vfamFilter = sub ? sub.rule : null;
    fam = "all";
    $$(".cj-fam-btn", container).forEach(function(x){ x.classList.toggle("is-on", x.dataset.fam === "all"); });
    if (searchInput) searchInput.value = "";
    search = "";
    renderList();
  };

  renderList();
}

const DRILL = [
  {q:'<span class="clue">Hier</span>, elle _____ (finir) le projet.', a:'a fini'},
  {q:'<span class="clue">Demain</span>, je _____ (aller) à Paris.', a:'irai'},
  {q:'<span class="clue">Tous les jours</span>, nous _____ (prendre) le bus.', a:'prenons'},
  {q:'<span class="clue">Quand j’étais jeune</span>, je _____ (jouer) au tennis.', a:'jouais'},
  {q:'<span class="clue">En ce moment</span>, il _____ (dormir).', a:'dort'},
  {q:'<span class="clue">Si tu venais</span>, tu _____ (voir) le match.', a:'verrais'},
  {q:'<span class="clue">Il faut que</span> tu _____ (être) courageux.', a:'sois'},
  {q:'<span class="clue">La semaine prochaine</span>, ils _____ (partir) en vacances.', a:'partiront'},
  {q:'<span class="clue">Autrefois</span>, les gens _____ (écrire) des lettres.', a:'écrivaient'},
  {q:'<span class="clue">Dès qu’</span>il _____ (arriver), nous mangerons.', a:'arrivera'},
  {q:'<span class="clue">Maintenant</span>, vous _____ (comprendre) la règle.', a:'comprenez'},
  {q:'<span class="clue">Bien qu’</span>il _____ (avoir) tort, il continue.', a:'ait'}
];
/* The deck's own bank, captured before initSpeedDrill shadows the name. */
const DRILL_DEFAULT = DRILL;

function initSpeedDrill(container){
  if (!container) return;
  /* Per-container question bank. A lesson supplies its own words through
     data-drill; the grammar slides carry none and use the shared bank. */
  const DRILL = (function(){
    try {
      const d = JSON.parse(container.dataset.drill || 'null');
      if (Array.isArray(d) && d.length) return d;
    } catch(err){ console.warn('drill data parse failed', err); }
    return DRILL_DEFAULT;
  })();
  if (!DRILL.length) return;
  const setup = $('.drill-setup', container), play = $('.drill-play', container), done = $('.drill-done', container);
  const qEl = $('.drill-q', container), inp = $('.drill-input', container), fb = $('.drill-feedback', container);
  const idxEl = $('.drill-idx', container), scoreEl = $('.drill-score', container), totEl = $('.drill-tot', container),
        timeEl = $('.drill-time', container), finalEl = $('.drill-final', container);
  let order = [], pos = 0, score = 0, timerOn = false, tId = null, left = 0;
  if (totEl) totEl.textContent = DRILL.length;

  function clearTimer(){ if (tId){ clearInterval(tId); tId = null; } if (timeEl) timeEl.textContent = ''; }
  function startTimer(){
    if (!timerOn) return;
    left = 30; if (timeEl) timeEl.textContent = '⏱ ' + left + 's';
    clearTimer();
    tId = setInterval(() => {
      left--; if (timeEl) timeEl.textContent = '⏱ ' + left + 's';
      if (left <= 0){ clearTimer(); judge(true); }
    }, 1000);
  }
  function show(){
    const item = DRILL[order[pos]];
    if (idxEl) idxEl.textContent = pos + 1;
    if (qEl) qEl.innerHTML = item.q;
    if (inp){ inp.value = ''; inp.className = 'drill-input'; inp.disabled = false; setTimeout(() => inp.focus(), 30); }
    if (fb){ fb.textContent = ''; fb.className = 'drill-feedback'; }
    startTimer();
  }
  function judge(timeout){
    const item = DRILL[order[pos]];
    if (inp.disabled) return;
    clearTimer();
    const accepted = item.a.split('|').map(norm);
    const ok = !timeout && accepted.includes(norm(inp.value));
    inp.disabled = true; inp.classList.add(ok ? 'correct' : 'wrong');
    if (ok){ score++; if (scoreEl) scoreEl.textContent = score; fb.className = 'drill-feedback ok'; fb.textContent = '✓ Correct'; playSound('correct'); }
    else { fb.className = 'drill-feedback no'; fb.textContent = (timeout ? '⏱ Time! ' : '✗ ') + 'Answer: ' + item.a.split('|')[0]; playSound('wrong'); }
    setTimeout(next, 950);
  }
  function next(){
    pos++;
    if (pos >= order.length){ finish(); return; }
    show();
  }
  function finish(){
    clearTimer();
    play.hidden = true; done.hidden = false;
    const pct = Math.round(score / DRILL.length * 100);
    if (finalEl) finalEl.innerHTML = `<div style="font-size:2rem;font-weight:900;color:var(--heading-color);">${score} / ${DRILL.length}</div><div class="gloss">${pct}% correct</div>`;
    if (score / DRILL.length >= 0.7){ try { burstConfetti(); burstFireworks(); } catch(e){} }
  }
  function start(){
    order = DRILL.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
    pos = 0; score = 0; if (scoreEl) scoreEl.textContent = '0';
    setup.hidden = true; done.hidden = true; play.hidden = false;
    const cb = $('.drill-timer-cb', container); timerOn = !!(cb && cb.checked);
    show();
  }
  const startBtn = $('.drill-start', container); if (startBtn) startBtn.addEventListener('click', start);
  const restartBtn = $('.drill-restart', container); if (restartBtn) restartBtn.addEventListener('click', () => { done.hidden = true; setup.hidden = false; });
  const submitBtn = $('.drill-submit', container); if (submitBtn) submitBtn.addEventListener('click', () => judge(false));
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); judge(false); } });
}

/* ================= LESSON WIDGETS (from the 10th-lessons project) =================
   Bare top-level code by design: it lives INSIDE this IIFE so its 17 declarations
   -- tween, shake, flash among them -- stay function-scoped instead of becoming
   window globals. It depends on $, $$, ls, speakFrench, speechOK, frVoice, reduced
   and playSound, all defined above. ============================================ */
/* ================================================================
   LESSON APP — ADDITIVE MODULES
   Vocabulary audio, list reading, mask-and-check, photo fallback.
   Everything here is guarded: on a slide with none of these
   elements every function is a no-op, so this block is safe to
   paste into the Master Grammar App unchanged.
   ================================================================ */

/* ---------------- Speech rate (settings-driven) ---------------- */
window.__frRate = parseFloat(ls.get('speech_rate', '0.92')) || 0.92;

/* ---------------- The French text of a vocabulary cell ----------------
   Strips the gender badge, the injected 🔊 and any English gloss, so the
   voice reads the word and nothing else. */
function vocText(el){
  const clone = el.cloneNode(true);
  clone.querySelectorAll('.nom-g, .audio-btn, .gloss, .voc-en').forEach(n => n.remove());
  return (clone.textContent || '')
    .replace(/[«»→]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/* ---------------- 🔊 on every vocabulary word ---------------- */
function injectVocabAudio(){
  if (!speechOK) return;
  $$('.voc-fr').forEach(el => {
    if (el.dataset.audio) return;
    el.dataset.audio = '1';
    const b = document.createElement('button');
    b.className = 'audio-btn'; b.type = 'button';
    b.title = 'Écouter en français'; b.textContent = '🔊';
    b.addEventListener('click', ev => { ev.stopPropagation(); speakFrench(vocText(el), b); });
    el.appendChild(b);
  });
}

/* ---------------- ▶ Read the whole list ----------------
   One utterance per row, chained on `onend`, so the class can repeat
   after each word. Clicking again stops it. */
let readingBtn = null;
function stopReading(){
  try { speechSynthesis.cancel(); } catch(e){}
  $$('.voc-btn.reading').forEach(b => { b.classList.remove('reading'); b.textContent = '▶ Lire'; });
  $$('.voc-fr.speaking-now').forEach(el => el.classList.remove('speaking-now'));
  readingBtn = null;
}
function speakSequence(cells, btn){
  if (!speechOK || !cells.length) return;
  stopReading();
  readingBtn = btn;
  if (btn){ btn.classList.add('reading'); btn.textContent = '■ Stop'; }
  let i = 0;
  const step = () => {
    if (readingBtn !== btn){ return; }             /* stopped or replaced */
    if (i >= cells.length){ stopReading(); return; }
    const el = cells[i++];
    const txt = vocText(el);
    if (!txt){ step(); return; }
    cells.forEach(c => c.classList.remove('speaking-now'));
    el.classList.add('speaking-now');
    try {
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'fr-FR';
      u.rate = (window.__frRate || 0.92);
      if (frVoice) u.voice = frVoice;
      u.onend = () => setTimeout(step, 320);       /* a beat to repeat after */
      u.onerror = () => setTimeout(step, 120);
      speechSynthesis.speak(u);
    } catch(e){ step(); }
  };
  step();
}

/* ---------------- Photographs: never leave a hole ----------------
   Every <img> carries the caption it should fall back to. If the link
   fails — a dead URL, or a classroom laptop with no network — the photo
   is replaced by a themed panel that still says what it was showing. */
/* A hung request, not a dead one — `error` already covers dead links, and it
   fires at once. This only has to outlast a slow classroom connection loading
   a screenful of photographs, so it is deliberately patient. */
const PHOTO_TIMEOUT_MS = 20000;

/* The placeholder is shown ALONGSIDE the image, never in place of it, so that
   a photo which arrives late can still take over. Replacing the <img> was a
   one-way door: a slow connection meant the picture was gone for the rest of
   the lesson even once it had downloaded. */
function photoSwap(img){
  if (img.dataset.fbDone || !img.parentNode) return;
  img.dataset.fbDone = '1';
  const div = document.createElement('div');
  div.className = 'img-fallback';
  /* In the photo→word game the caption IS the answer, so those images ask for
     a neutral placeholder. Everywhere else, naming what the photo showed is
     the whole point of having a placeholder at all. */
  const cap = img.dataset.fb;
  div.innerHTML = cap
    ? '<span><b>🖼️ ' + cap + '</b>La photo n&#39;a pas pu être chargée — pas de connexion ?</span>'
    : '<span><b>🖼️ Photo indisponible</b>Pas de connexion ?</span>';
  img.classList.add('is-missing');
  img.parentNode.insertBefore(div, img);
}
function photoRestore(img){
  if (!img.dataset.fbDone) return;
  delete img.dataset.fbDone;
  img.classList.remove('is-missing');
  const prev = img.previousElementSibling;
  if (prev && prev.classList.contains('img-fallback')) prev.remove();
}
function initPhotoFallback(){
  /* Wire an error handler on every photo, once. A late `load` takes the
     placeholder back down again. */
  $$('img[data-fb]').forEach(img => {
    if (img.dataset.fbWired) return;
    img.dataset.fbWired = '1';
    img.addEventListener('error', () => photoSwap(img));
    img.addEventListener('load', () => { if (img.naturalWidth > 0) photoRestore(img); });
    if (img.complete && img.naturalWidth === 0) photoSwap(img);   /* failed before wiring */
  });

  /* A watchdog, but only for the slide actually on screen. A dead link fires
     `error`; a school network behind a captive portal, or one that has simply
     gone away, leaves the request hanging for ever and fires nothing at all —
     which would leave an empty frame in front of the class. The timer is
     started only for the current slide, because `loading="lazy"` means an
     off-screen photo has not begun loading and would trip it falsely. */
  const cur = (typeof Deck !== 'undefined' && Deck.getCurrentSlide) ? Deck.getCurrentSlide() : null;
  if (!cur) return;
  $$('img[data-fb]', cur).forEach(img => {
    if (img.dataset.fbWatch || img.dataset.fbDone) return;
    if (img.complete && img.naturalWidth > 0) return;
    img.dataset.fbWatch = '1';
    const t = setTimeout(() => {
      if (!img.dataset.fbDone && img.naturalWidth === 0) photoSwap(img);
    }, PHOTO_TIMEOUT_MS);
    img.addEventListener('load', () => clearTimeout(t), { once: true });
  });
}

/* ================================================================
   THE MOTION CONTRACT
   app.html learned these four rules the hard way (see its comments on
   nomCardPop and __enhanceTimeline) and everything below obeys them:

     1. Never animate opacity on a Reveal .fragment — Reveal owns fragment
        opacity, and a tween that fights it leaves the content faint for
        good. Transform only, on anything Reveal controls.
     2. gsap.fromTo with an EXPLICIT end value, never gsap.from, plus
        clearProps so CSS governs once the tween is done.
     3. Run-once guards, so a re-shown fragment does not re-animate.
     4. A settle timeout that strips inline styles whatever happened. A
        missing flourish is fine; invisible text is not.

   Every call is additionally guarded on `reduced` and on GSAP existing.
   ================================================================ */
/* Motion runs only when it can actually finish. A hidden tab freezes
   requestAnimationFrame, so a tween started there sets its FROM state — opacity
   0 — and then never advances, stranding the diagram invisible until the tab
   comes back. Checking visibility up front is what stops that. */
const motionOK = () => !reduced &&
  typeof gsap !== 'undefined' &&
  document.visibilityState === 'visible';

/* Undo everything a tween can leave behind. GSAP writes SVG transforms to the
   transform ATTRIBUTE, not to style, so clearing style properties alone is not
   enough — that is what left the school-ladder diagram at scale 0.97, opacity 0.
   Any authored transform is captured first and put back. */
function settleEls(list){
  list.forEach(el => {
    if (!el || !el.style) return;
    ['opacity', 'transform', 'translate', 'rotate', 'scale', 'transform-origin']
      .forEach(p => el.style.removeProperty(p));
    if (el.namespaceURI === 'http://www.w3.org/2000/svg'){
      const orig = el.dataset.tfOrig;
      if (orig) el.setAttribute('transform', orig);
      else el.removeAttribute('transform');
    }
  });
}

/* Animate, then guarantee the elements end up plainly visible. */
function tween(targets, from, to){
  const list = (Array.isArray(targets) ? targets : [targets]).filter(Boolean);
  if (!list.length) return;
  list.forEach(el => {
    if (el.namespaceURI === 'http://www.w3.org/2000/svg' &&
        el.hasAttribute('transform') && el.dataset.tfOrig === undefined){
      el.dataset.tfOrig = el.getAttribute('transform');
    }
  });
  const settle = () => settleEls(list);
  if (!motionOK()){ settle(); return; }
  try {
    gsap.fromTo(list, from, Object.assign({ onComplete: settle }, to));
  } catch(e){ settle(); }
  setTimeout(settle, 2200);          /* last-resort net, as the reference does */
}

/* If the tab was hidden mid-tween, settle everything the moment it returns. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  try {
    if (typeof gsap !== 'undefined') gsap.globalTimeline.getChildren().forEach(t => { try { t.progress(1); } catch(e){} });
    settleEls($$('.anim-svg [data-step]'));
  } catch(e){}
});

/* ---------------- Animated SVG diagrams ----------------
   Each <g data-step="n"> inside .anim-svg is revealed in order the first
   time its slide is shown. The groups are visible in CSS, so a browser
   without GSAP — or a viewer who asked for reduced motion — simply sees
   the finished diagram. These are SVG groups, not Reveal fragments, so
   animating their opacity is safe. */
function initAnimSvg(root){
  $$('.anim-svg', root || document).forEach(box => {
    if (box.dataset.animDone) return;
    box.dataset.animDone = '1';
    const steps = $$('[data-step]', box)
      .sort((a, b) => (+a.dataset.step) - (+b.dataset.step));
    if (!steps.length) return;
    tween(steps,
      { opacity: 0, y: 14, scale: 0.97, transformOrigin: '50% 50%' },
      { opacity: 1, y: 0, scale: 1, duration: 0.42, stagger: 0.13, ease: 'back.out(1.5)' });
  });
}

/* ---------------- Widget 1 · Trier les mots ----------------
   Click a chip, then click the bucket it belongs in. Feedback is
   immediate, the way the QCM already behaves: a right answer lands in the
   bucket, a wrong one shakes and stays in the pool, so the exercise
   self-corrects in front of the class. Degrades to a readable list of
   words and headings if the script never runs. */
function initTrier(box){
  if (!box || box.dataset.trierOn) return;
  box.dataset.trierOn = '1';
  const pool    = $('.trier-pool', box);
  const buckets = $$('.trier-bucket', box);
  const msg     = $('.trier-msg', box);
  const scoreEl = $('.trier-score', box);
  if (!pool || !buckets.length) return;

  const chips = $$('.trier-chip', pool);
  const total = chips.length;
  let placed = 0, wrong = 0, sel = null;

  const paint = () => {
    if (scoreEl) scoreEl.textContent = `${placed} / ${total}`;
    if (!msg) return;
    if (placed < total){ msg.textContent = ''; msg.className = 'trier-msg'; return; }
    msg.className = 'trier-msg ' + (wrong ? 'no' : 'ok');
    msg.textContent = wrong
      ? `Terminé — ${wrong} erreur${wrong > 1 ? 's' : ''} en route. Refaites-le pour un sans-faute.`
      : 'Sans faute ! Tous les mots sont dans la bonne colonne.';
    if (!wrong){ try { burstConfetti(); burstFireworks(); } catch(e){} }
  };

  const select = chip => {
    if (chip.classList.contains('used')) return;
    chips.forEach(c => c.classList.remove('sel'));
    sel = (sel === chip) ? null : chip;
    if (sel) sel.classList.add('sel');
    playSound('pop');
  };

  const drop = bucket => {
    if (!sel) { flash(bucket); return; }
    const chip = sel;
    if (chip.dataset.k === bucket.dataset.k){
      chip.classList.remove('sel');
      chip.classList.add('used');
      const li = document.createElement('li');
      li.textContent = chip.textContent.trim();
      $('ul', bucket).appendChild(li);
      tween([li], { y: 10, scale: 0.9 }, { y: 0, scale: 1, duration: 0.28, ease: 'back.out(1.7)' });
      placed++; sel = null;
      playSound('correct');
    } else {
      wrong++;
      chip.classList.remove('sel');
      shake(chip); shake(bucket);
      sel = null;
      playSound('wrong');
    }
    paint();
  };

  chips.forEach(c => c.addEventListener('click', ev => { ev.stopPropagation(); select(c); }));
  buckets.forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); drop(b); }));

  const reset = $('.trier-reset', box);
  if (reset) reset.addEventListener('click', ev => {
    ev.stopPropagation();
    placed = 0; wrong = 0; sel = null;
    chips.forEach(c => c.classList.remove('used', 'sel'));
    buckets.forEach(b => { const u = $('ul', b); if (u) u.innerHTML = ''; });
    if (msg){ msg.textContent = ''; msg.className = 'trier-msg'; }
    paint();
  });
  paint();
}
function shake(el){
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;                 /* restart the CSS animation */
  el.classList.add('shake');
  setTimeout(() => el.classList.remove('shake'), 600);
}
function flash(el){
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 380);
}

/* ---------------- Widget 2 · Diagramme cliquable ----------------
   A themed SVG scene with numbered hotspots. Clicking one names the thing
   in French, with its gender, the English and a 🔊. Same shape as the
   grammar app's tense timeline: click a node, fill a detail panel. */
function initHotspot(box){
  if (!box || box.dataset.hsOn) return;
  box.dataset.hsOn = '1';
  let data = {};
  try { data = JSON.parse(box.dataset.hs || '{}'); }
  catch(e){ console.warn('Hotspot data parse failed', e); return; }
  const detail = $('.hs-detail', box);
  const dots   = $$('.hs-dot', box);
  if (!detail || !dots.length) return;

  const show = k => {
    const d = data[k];
    if (!d) return;
    dots.forEach(n => n.classList.toggle('active', n.dataset.k === k));
    const g = d.g ? `<span class="nom-g nom-${d.g}">${d.g}</span>` : '';
    detail.innerHTML =
      `<p class="hs-fr voc-fr">${d.fr}${g}</p>` +
      `<p class="hs-en">${d.en || ''}</p>` +
      (d.note ? `<p class="gloss">${d.note}</p>` : '');
    const fr = $('.hs-fr', detail);
    if (fr){ fr.dataset.audio = ''; injectVocabAudio(); }
    tween([detail], { y: 8, scale: 0.98 }, { y: 0, scale: 1, duration: 0.24, ease: 'power2.out' });
    playSound('pop');
  };

  dots.forEach(n => {
    n.setAttribute('tabindex', '0');
    n.addEventListener('click', ev => { ev.stopPropagation(); show(n.dataset.k); });
    n.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); show(n.dataset.k); } });
  });

  const all = $('.hs-all', box);
  if (all) all.addEventListener('click', ev => {
    ev.stopPropagation();
    const on = box.classList.toggle('labels-on');
    all.textContent = on ? '🙈 Cacher les mots' : '🏷️ Tout étiqueter';
  });

  show(dots[0].dataset.k);
}

/* ---------------- Widget 3 · Photo → mot ----------------
   Click a word, then the photograph it names. This is what a page full of
   photographs is actually for: recognition, not decoration. */
function initPhotoMatch(box){
  if (!box || box.dataset.pmOn) return;
  box.dataset.pmOn = '1';
  const words  = $$('.pm-word', box);
  const photos = $$('.pm-photo', box);
  const msg    = $('.pm-msg', box);
  const scoreEl= $('.pm-score', box);
  if (!words.length || !photos.length) return;

  const total = words.length;
  let done = 0, misses = 0, sel = null;

  const paint = () => {
    if (scoreEl) scoreEl.textContent = `${done} / ${total}`;
    if (!msg) return;
    if (done < total){ msg.textContent = ''; msg.className = 'pm-msg'; return; }
    msg.className = 'pm-msg ' + (misses ? 'no' : 'ok');
    msg.textContent = misses
      ? `Toutes appariées — avec ${misses} essai${misses > 1 ? 's' : ''} en trop.`
      : 'Parfait — chaque mot du premier coup !';
    if (!misses){ try { burstConfetti(); } catch(e){} }
  };

  words.forEach(w => w.addEventListener('click', ev => {
    ev.stopPropagation();
    if (w.classList.contains('used')) return;
    words.forEach(x => x.classList.remove('sel'));
    sel = (sel === w) ? null : w;
    if (sel) sel.classList.add('sel');
    playSound('pop');
  }));

  photos.forEach(p => p.addEventListener('click', ev => {
    ev.stopPropagation();
    if (p.classList.contains('done')) return;
    if (!sel){ flash(p); return; }
    if (sel.dataset.k === p.dataset.k){
      p.classList.add('done');
      sel.classList.add('used');
      sel.classList.remove('sel');
      const cap = document.createElement('span');
      cap.className = 'pm-label';
      cap.textContent = sel.textContent.trim();
      p.appendChild(cap);
      tween([cap], { y: 8 }, { y: 0, duration: 0.24, ease: 'power2.out' });
      done++; sel = null;
      playSound('correct');
    } else {
      misses++;
      shake(p);
      sel.classList.remove('sel'); sel = null;
      playSound('wrong');
    }
    paint();
  }));
  paint();
}

/* ============ DRAG & DROP IMAGE OVERLAY (teaching aid) ============
   Drop any local image onto the running deck to show it full-screen to the class.
   Deliberately NOT persisted: it is transient, and stashing arbitrary dropped
   images in localStorage would blow the quota during a long lesson. */
function initDropOverlay(){
  const overlay = $("#dropOverlay"), img = $("#dropImage"),
        hint = $("#dropHint"), closeBtn = $("#dropClose");
  if (!overlay || !img || !hint) return;
  let url = null, depth = 0;

  const clearUrl = () => { if (url){ try { URL.revokeObjectURL(url); } catch(e){} url = null; } };
  const hide = () => { overlay.classList.remove("on"); img.removeAttribute("src"); clearUrl(); };
  const showHint = on => { depth = on ? depth : 0; hint.classList.toggle("on", on); };

  const show = file => {
    if (!file || String(file.type || "").indexOf("image/") !== 0) { showToast("⚠️ That file is not an image"); return; }
    clearUrl();
    url = URL.createObjectURL(file);
    img.src = url;
    overlay.classList.add("on");
    showToast("🖼️ Image shown — click or press Esc to close");
  };

  /* every handler preventDefault()s: without it the browser navigates away from
     the deck to the dropped file, which would wreck a live lesson. */
  window.addEventListener("dragenter", e => { e.preventDefault(); depth++; showHint(true); });
  window.addEventListener("dragover",  e => { e.preventDefault(); });
  window.addEventListener("dragleave", e => { e.preventDefault(); if (--depth <= 0) showHint(false); });
  window.addEventListener("drop", e => {
    e.preventDefault(); showHint(false);
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    show(f);
  });

  overlay.addEventListener("click", hide);
  if (closeBtn) closeBtn.addEventListener("click", e => { e.stopPropagation(); hide(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("on")) hide(); });
}

/* ============================================================
   VERB FAMILY NAVIGATOR  (cj-nav-1)
   4 ending-based tabs -> 19 sub-families -> every verb, all 10 tenses.
   The rule() predicates are the SINGLE SOURCE OF TRUTH: they drive both
   the navigator's bucketing and the Lab's fine filter, so the two can
   never disagree. check-vfam.js extracts this block and tests it.
   ============================================================ */
function vfInf(v){ return String(v && v.inf || '').toLowerCase(); }
function vfPres(v){ return String(v && v.t && v.t.present && v.t.present[0] || '').toLowerCase(); }
function vfModel(v){ return String(v && v.model || ''); }
function vfIn(v, list){ return list.indexOf(vfModel(v)) !== -1; }
function vfEnds(v, suffix){ const s = vfInf(v); return s.slice(-suffix.length) === suffix; }

/* -ER sub-buckets are decided from the ACTUAL conjugated form, not the model
   label: the dataset's ELER model mixes epeler/geler/renouveler (accent shift,
   "je gele") with nothing that doubles, while APPELER/JETER really do double.
   Reading the form makes this self-correcting. */
function vfErDoubles(v){
  const p = vfPres(v), i = vfInf(v);
  return (p.indexOf('ll') !== -1 && i.indexOf('ll') === -1) ||
         (p.indexOf('tt') !== -1 && i.indexOf('tt') === -1);
}
function vfErAccent(v){
  return vfPres(v).indexOf('è') !== -1 && vfInf(v).indexOf('è') === -1;
}
function vfIsRegEr(v){ return v && v.fam === 'reg-er'; }   /* excludes aller (fam: essential) */

const VF_M = {
  irReg:      ['IR'],
  irLikeEr:   ['VRIR','FRIR','CUEILLIR'],

  irAutres:   ['COURIR','ÉRIR','FUIR','HAÏR','MOURIR'],

  reConn:     ['AÎTRE','NAÎTRE'],

  ]},

  { id:'irr', label:'Irréguliers', hint:'learn these by heart', sub:[
    { id:'irr-piliers', label:'Les 4 piliers', model:'être · avoir · aller · faire',

      endings:['—','—','—','—','—','—'],
      rule_en:'No pattern at all. These are the four most frequent verbs in French, and they double as <b>auxiliaries</b>.',
