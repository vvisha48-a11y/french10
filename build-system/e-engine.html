       Such a verb stays reachable instead of silently disappearing, and the chip
       hides itself when empty. check-vfam.js asserts it IS empty today. */
    { id:'irr-autres', label:'Autres', model:'—',
      rule:() => false,
      endings:['—','—','—','—','—','—'],
      rule_en:'Verbs that match no known family — open them in the Lab to see their full conjugation.',
      demo:'—' }
  ]}
];
const VF_FALLBACK = 'irr-autres';

/* first matching sub-family, scanning tabs in order; null = orphan */
function vfBucketOf(v){
  for (let i = 0; i < VFAM.length; i++){
    const t = VFAM[i];
    for (let j = 0; j < t.sub.length; j++){
      try { if (t.sub[j].rule(v)) return { tab:t.id, sub:t.sub[j].id }; } catch(e){}
    }
  }
  return { tab:'irr', sub:VF_FALLBACK };   /* never null — an unmatched verb stays reachable */
}
function vfSubById(id){
  for (let i = 0; i < VFAM.length; i++){
    const s = VFAM[i].sub.filter(x => x.id === id);
    if (s.length) return s[0];
  }
  return null;
}

function initVerbFamilies(container){
  if (!container) return;
  const DATA = (typeof VERBS500 !== 'undefined' && VERBS500) ? VERBS500 : null;
  const src = DATA || CONJ;
  const isFull = !!DATA;
  const rec = k => {
    const v = src[k]; if (!v) return null;
    return isFull ? v : { inf:v.inf, en:v.en, group:v.group, fam:v.fam, model:'—', t:v };
  };

  const tabsWrap = $('.vfam-tabs', container),
        subsWrap = $('.vfam-subs', container),
        panel    = $('.vfam-panel', container);
  /* Fail loudly-but-gracefully: a silent `return` here is what makes a slide look
     blank with no clue why, so say so on the slide itself. */
  if (!tabsWrap || !subsWrap || !panel){
    container.innerHTML = '<p class="vfam-empty">Navigator markup incomplete — expected .vfam-tabs, .vfam-subs and .vfam-panel.</p>';
    console.warn('initVerbFamilies: missing', !tabsWrap ? '.vfam-tabs' : '', !subsWrap ? '.vfam-subs' : '', !panel ? '.vfam-panel' : '');
    return;
  }

  /* bucket every verb once, at init */
  const buckets = {};
  VFAM.forEach(t => t.sub.forEach(s => { buckets[s.id] = []; }));
  Object.keys(src).forEach(k => {
    const b = vfBucketOf(rec(k));
    if (b && buckets[b.sub]) buckets[b.sub].push(k);
  });
  const tabCount = t => t.sub.reduce((n, s) => n + buckets[s.id].length, 0);

  let curTab = VFAM[0], curSub = null, curVerb = null, search = '';

  /* ---- tabs ---- */
  VFAM.forEach(t => {
    const b = document.createElement('button');
    b.className = 'vfam-tab' + (t === VFAM[0] ? ' is-on' : '');
    b.dataset.vtab = t.id;
    b.innerHTML = '<span class="vfam-tab-l">' + t.label + '</span>' +
                  '<span class="vfam-tab-n">' + tabCount(t) + ' verbs</span>';
    b.addEventListener('click', () => {
      curTab = t; curSub = null; curVerb = null; search = '';
      $$('.vfam-tab', container).forEach(x => x.classList.toggle('is-on', x === b));
      renderSubs(); try { playSound('pop'); } catch(e){}
    });
    tabsWrap.appendChild(b);
  });

  /* ---- sub-family chips ---- */
  function renderSubs(){
    subsWrap.innerHTML = '';
    curTab.sub.forEach(s => {
      if (!buckets[s.id].length) return;      /* an empty family renders no dead chip */
      const b = document.createElement('button');
      b.className = 'vfam-chip' + (curSub && curSub.id === s.id ? ' is-on' : '');
      b.dataset.vsub = s.id;
      b.innerHTML = s.label + '<span class="vfam-chip-n">' + buckets[s.id].length + '</span>';
      b.addEventListener('click', () => {
        curSub = s; curVerb = null; search = '';
        $$('.vfam-chip', container).forEach(x => x.classList.toggle('is-on', x === b));
        renderPanel(); try { playSound('pop'); } catch(e){}
      });
      subsWrap.appendChild(b);
    });
    panel.innerHTML = '<p class="vfam-empty">Choose a family above to see its pattern and its verbs.</p>';
  }

  /* ---- panel: pattern card + every verb + inline 10-tense conjugation ---- */
  function renderPanel(){
    if (!curSub) return;
    const s = curSub, list = buckets[s.id];
    panel.innerHTML =
      '<div class="vfam-card">' +
        '<div class="vfam-endings">' +
          '<div class="vfam-end-h">Present — model: <b>' + s.model + '</b></div>' +
          CJ_PRON.map((p, i) => '<div class="vfam-end-r"><span>' + p + '</span><b>' + (s.endings[i] || '—') + '</b></div>').join('') +
        '</div>' +
        '<div class="vfam-rule"><p>' + s.rule_en + '</p><p class="vfam-demo">' + s.demo + '</p>' +
          '<button class="vfam-open" type="button">Open in the Lab →</button></div>' +
      '</div>' +
      '<div class="vfam-listbar">' +
        '<input class="vfam-search" type="text" autocomplete="off" placeholder="Search within the ' + list.length + ' verbs…">' +
        '<span class="vfam-count gloss"></span>' +
      '</div>' +
      '<div class="vfam-verbs"></div>' +
      '<div class="vfam-conj"><div class="cj-head"></div><div class="cj-allgrid"></div></div>';

    const si = $('.vfam-search', panel);
    let tmr = null;
    si.addEventListener('input', () => {
      clearTimeout(tmr);
      tmr = setTimeout(() => { search = norm(si.value); renderVerbs(); }, 160);
    });
    $('.vfam-open', panel).addEventListener('click', () => openInLab(s.id));
    renderVerbs();
  }

  function renderVerbs(){
    const wrap = $('.vfam-verbs', panel), cnt = $('.vfam-count', panel);
    if (!wrap) return;
    const all = buckets[curSub.id].filter(k => {
      if (!search) return true;
      const v = rec(k);
      return norm(v.inf).indexOf(search) !== -1 || norm(v.en).indexOf(search) !== -1;
    });
    wrap.innerHTML = '';
    if (!all.length){
      wrap.innerHTML = '<span class="vfam-empty">No verb matches.</span>';
      if (cnt) cnt.textContent = '0 / ' + buckets[curSub.id].length;
      return;
    }
    all.forEach(k => {
      const b = document.createElement('button');
      b.className = 'vfam-verb' + (k === curVerb ? ' is-on' : '');
      b.dataset.vverb = k;
      b.textContent = rec(k).inf;
      b.addEventListener('click', () => {
        curVerb = k;
        $$('.vfam-verb', panel).forEach(x => x.classList.toggle('is-on', x === b));
        showConj(k); try { playSound('pop'); } catch(e){}
      });
      wrap.appendChild(b);
    });
    if (cnt) cnt.textContent = all.length + ' / ' + buckets[curSub.id].length + ' verbs';
    if (!curVerb || all.indexOf(curVerb) === -1){ curVerb = all[0]; $$('.vfam-verb', panel)[0].classList.add('is-on'); }
    showConj(curVerb);
  }

  /* all 10 tenses, rendered by the SAME function the Lab uses */
  function showConj(k){
    const box = $('.vfam-conj', panel);
    if (!box) return;
    cjRenderAllTenses(rec(k), $('.cj-head', box), $('.cj-allgrid', box), {});
  }

  function openInLab(subId){
    const lab = $('.conjlab');
    const sec = lab ? lab.closest('section[data-slide-id]') : null;
    if (sec){
      try {
        const idx = Deck.getIndices(sec);
        Deck.slide(idx.h, idx.v || 0);
      } catch(e){
        const stacks = $$('#slidesRoot > section');
        for (let h = 0; h < stacks.length; h++){
          const vs = $$(':scope > section', stacks[h]);
          for (let v = 0; v < vs.length; v++) if (vs[v] === sec) { try { Deck.slide(h, v); } catch(e2){} }
        }
      }
    }
    if (lab && typeof lab.__setVFam === 'function') lab.__setVFam(subId);
  }

  renderSubs();
}

/* ============================================================
   NOMINALISATION — card motion
   The vocabulary cards are Reveal FRAGMENTS, so Reveal owns their opacity.
   This animates TRANSFORM ONLY. That is deliberate: the timeline bug in this
   file (see __enhanceTimeline) came from a tween touching opacity and winning
   a fight it should never have been in. If GSAP is absent, reduced motion is
   requested, or the tween throws, the card is simply there — never faint.
   ============================================================ */
function nomCardPop(el){
  if (!el || !el.classList || !el.classList.contains('nom-cell')) return;
  if (!el.closest('section[data-slide-id^="nom-v"]')) return;
  if (el.dataset.nomPopped === '1') return;      // per-card guard: re-showing a
  el.dataset.nomPopped = '1';                    // fragment must not re-animate
  if (reduced || typeof gsap === 'undefined') return;
  const settle = () => { el.style.transform = ''; };
  try {
    gsap.fromTo(el,
      { y: 16, scale: 0.94 },
      { y: 0, scale: 1, duration: 0.32, ease: 'back.out(1.7)', clearProps: 'transform' });
  } catch (e) { settle(); }
  setTimeout(settle, 1200);                      // last-resort net, as with the timeline
}
/* ============================================================
   MODEL LETTERS — the FR/EN toggle
   State is global (body.letter-en) but the button is repeated on every letter
   slide, so all of them are kept in sync. The click handler is DELEGATED, like
   the flip cards, because viewDistance:2 means most letter slides are not in
   the DOM at boot.
   ============================================================ */
const LETTER_FS_FLOOR = 0.86;   // vh — the runtime refit will not go below this

/* The baked --let-fs-en assumes a 1276px-wide column at 100% font scale. A
   narrower window, or the 115/130% setting, can still overflow — and .let-slide
   is overflow:hidden, so an overflow would CLIP rather than scroll. Measure the
   real box and step down until it fits. */
function refitLetters(){
  /* Two-way fit, current slide only. Shrinking prevents overflow; GROWING is
     what makes projector mode actually fill the screen instead of leaving the
     bottom half empty. Solved arithmetically (<=5 reflows) — an earlier version
     stepped 30 times per paper and janked badly. */
  const cur = typeof Deck !== 'undefined' && Deck.getCurrentSlide ? Deck.getCurrentSlide() : null;
  const paper = cur && $('.let-paper', cur);
  if (!paper) return;
  const card = paper.closest('.slide-card');
  if (!card || !paper.offsetParent) return;

  /* The baked values live in the element's own style attribute, so cache them
     before anything overwrites them — removeProperty() would destroy them. */
  if (!paper.dataset.bakedFs){
    paper.dataset.bakedFs   = paper.style.getPropertyValue('--let-fs').trim()    || '1.9vh';
    paper.dataset.bakedFsEn = paper.style.getPropertyValue('--let-fs-en').trim() || '1.4vh';
  }
  const en    = document.body.classList.contains('letter-en');
  const proj  = document.body.classList.contains('projector-mode');
  const prop  = en ? '--let-fs-en' : '--let-fs';
  const baked = parseFloat(en ? paper.dataset.bakedFsEn : paper.dataset.bakedFs) || (en ? 1.4 : 1.9);

  paper.style.setProperty('--let-fs',    paper.dataset.bakedFs);
  paper.style.setProperty('--let-fs-en', paper.dataset.bakedFsEn);
  card.style.removeProperty('overflow-y');

  let fs = baked;
  const over = card.scrollHeight - card.clientHeight;

  if (over > 1){
    /* too tall — height scales roughly with font size, so one ratio gets close */
    fs = Math.max(LETTER_FS_FLOOR, +(baked * (card.clientHeight / card.scrollHeight) * 0.97).toFixed(3));
    paper.style.setProperty(prop, fs + 'vh');
    for (let i = 0; i < 2 && fs > LETTER_FS_FLOOR; i++){
      if (card.scrollHeight <= card.clientHeight + 1) break;
      fs = Math.max(LETTER_FS_FLOOR, +(fs * 0.93).toFixed(3));
      paper.style.setProperty(prop, fs + 'vh');
    }
  } else if (proj){
    /* Projector mode only: grow to fill. Deliberately not done in normal mode,
       where the baked size is the designed one and the sidebar/topbar are up. */
    const used = card.scrollHeight / card.clientHeight;
    if (used < 0.92){
      const CEIL = baked * 2.2;                       // a 3-line letter must not become absurd
      fs = Math.min(CEIL, +(baked * (1 / used) * 0.94).toFixed(3));
      paper.style.setProperty(prop, fs + 'vh');
      /* step back if the grow overshot */
      for (let i = 0; i < 3 && card.scrollHeight > card.clientHeight + 1; i++){
        fs = +(fs * 0.94).toFixed(3);
        paper.style.setProperty(prop, fs + 'vh');
      }
    }
  }

  /* Still too tall means the window is genuinely too short for this letter.
     Scrolling beats clipping — .let-slide is overflow:hidden, which would
     silently swallow the end of the letter. */
  if (card.scrollHeight > card.clientHeight + 1) card.style.overflowY = 'auto';
  paper.dataset.refit = (fs === baked ? 'baked ' : '') + fs;
}

function syncLetterToggles(on){
  $$('.let-toggle').forEach(b => {
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? '✓ English on' : 'Show English';
  });
}

function initLetterToggle(){
  let on = ls.get('letter_en', '0') === '1';
  document.body.classList.toggle('letter-en', on);
  syncLetterToggles(on);
  refitLetters();

  /* delegated — works for letter slides rendered later by viewDistance */
  document.addEventListener('click', e => {
    const btn = e.target.closest('.let-toggle');
    if (!btn) return;
    e.stopPropagation();
    on = !document.body.classList.contains('letter-en');
    document.body.classList.toggle('letter-en', on);
    ls.set('letter_en', on ? '1' : '0');
    syncLetterToggles(on);
    refitLetters();
  });

  /* a slide entering the DOM, or a resize/font-scale change, needs re-measuring */
  Deck.on('slidechanged', () => { syncLetterToggles(document.body.classList.contains('letter-en')); refitLetters(); });
}


/* ---- Les Messages: the Build-the-Message widget ----
   The other three Messages widgets are pure CSS (:checked siblings). This one needs
   ordering logic, so it lives here. If it never runs, the chips and the empty list are
   still readable — the slide degrades to a static exercise rather than breaking. */
function initMsgBuilder(box){
  if (!box || box.dataset.msgBuilt === "1") return;
  box.dataset.msgBuilt = "1";
  const pool  = box.querySelector(".msg-build-pool");
  const slots = box.querySelector(".msg-build-slots");
  const note  = box.querySelector(".msg-build-msg");
  if (!pool || !slots || !note) return;
  const chips = Array.prototype.slice.call(pool.querySelectorAll(".msg-chip"));
  const total = chips.length;
  const placed = [];

  function verdict(){
    if (placed.length < total){ note.textContent = ""; note.className = "msg-build-msg"; return; }
    let wrong = 0;
    Array.prototype.slice.call(slots.children).forEach((li, i) => {
      const ok = placed[i] === String(i + 1);
      li.className = ok ? "ok" : "no";
      if (!ok) wrong++;
    });
    if (wrong === 0){
      note.textContent = "Correct — that is the CBSE order. Date, salutation, message, closing, name.";
      note.className = "msg-build-msg ok";
    } else {
      note.textContent = wrong + (wrong === 1 ? " line is" : " lines are") +
        " out of place. The date always goes first and the name always goes last.";
      note.className = "msg-build-msg no";
    }
  }

  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      if (chip.classList.contains("used")) return;
      chip.classList.add("used");
      placed.push(chip.dataset.k);
      const li = document.createElement("li");
      li.innerHTML = chip.innerHTML;
      slots.appendChild(li);
      if (typeof gsap !== "undefined" && !reduced){
        try { gsap.fromTo(li, { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: .26, ease: "back.out(1.7)", clearProps: "transform,opacity" }); }
        catch(e){ li.style.opacity = ""; }
      }
      verdict();
    });
  });

  const reset = document.createElement("button");
  reset.type = "button";
  reset.className = "msg-chip";
  reset.textContent = "↺  Start again";
  reset.addEventListener("click", () => {
    placed.length = 0;
    slots.innerHTML = "";
    note.textContent = "";
    note.className = "msg-build-msg";
    chips.forEach(c => c.classList.remove("used"));
  });
  box.appendChild(reset);
}

/* ============================================================
   MESSAGES — the English toggle
   Its own class and its own body flag. body.letter-en belongs to La Lettre and
   flipping it here would change letter slides too. Delegated, like the letter
   toggle and the flip cards, because viewDistance:2 keeps most message slides
   out of the DOM at boot.
   ============================================================ */
function syncMsgToggles(on){
  $$('.msg-toggle').forEach(b => {
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? '\u2713 English on' : 'Show English';
  });
}

function initMsgToggle(){
  let on = ls.get('messages_en', '0') === '1';
  document.body.classList.toggle('messages-en', on);
  syncMsgToggles(on);

  document.addEventListener('click', ev => {
    const btn = ev.target.closest('.msg-toggle');
    if (!btn) return;
    ev.stopPropagation();
    on = !document.body.classList.contains('messages-en');
    document.body.classList.toggle('messages-en', on);
    ls.set('messages_en', on ? '1' : '0');
    syncMsgToggles(on);
  });

  Deck.on('slidechanged', () => syncMsgToggles(document.body.classList.contains('messages-en')));
}
function boot(){
  if (booted) return; booted = true;
  restoreEdits();
  $$('.quiz-container').forEach(initQuizContainer);
  initFlipCards();
  initLabs();
  buildSearchIndex();
  renderTopicMenu();
  renderLeconMenu();
  applyMode(ls.get('mode','mode-teacher'));   // re-apply: enables/disables the widgets just wired
  restoreFromHash();
  updateHud();
  startFX();
  /* Phase-1 / Phase-2 module init (each guarded: a failure can never abort boot) */
  try { initTimeline(); } catch(e){ console.warn('Timeline init:', e); }
  try { $$('.conjlab').forEach(initConjLab); } catch(e){ console.warn('ConjLab init:', e); }
  try { $$('.drill').forEach(initSpeedDrill); } catch(e){ console.warn('Drill init:', e); }
  try { initDropOverlay(); } catch(e){ console.warn('Drop overlay init:', e); }
  try { $$('.vfam').forEach(initVerbFamilies); } catch(e){ console.warn('VerbFamilies init:', e); }
  try { initLetterToggle(); } catch(e){ console.warn('Letter toggle init:', e); }
  try { initMsgToggle(); } catch(e){ console.warn('Msg toggle init:', e); }
  try { $$('.msg-build').forEach(initMsgBuilder); } catch(e){ console.warn('MsgBuilder init:', e); }
  injectAudioButtons();
  try { refreshLessonSlide(); } catch(e){ console.warn('Lesson slide init:', e); }
  try { initLessonSettings(); } catch(e){ console.warn('Lesson settings init:', e); }
  if (ls.get('projector','0') === '1') setProjector(true);
  if (window.lucide) { try { lucide.createIcons(); } catch(e){} }
  if (typeof gsap !== 'undefined' && window.__enhanceTimeline) window.__enhanceTimeline();
  /* Reveal's first internal layout can run before the shell's inset is applied,
     leaving slides sized to the whole window. Force one once styles have settled,
     and again when the Google Fonts land and change text metrics. */
  requestAnimationFrame(() => { try { Deck.layout(); } catch(e){} });
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => { try { Deck.layout(); } catch(e){} });
  }
  Deck.on('slidechanged', () => { updateHud(); syncHash(); playSound('slide'); injectAudioButtons();
    try { refreshLessonSlide(); } catch(e){} });
  Deck.on('fragmentshown', ev => { updateHud(); updateStepHint(); if (ev && ev.fragment) nomCardPop(ev.fragment); });
  Deck.on('fragmenthidden', () => { updateHud(); updateStepHint(); });
}

/* Boot even if Reveal's init promise rejects — the deck itself still renders,
   and losing the whole UI to a History API restriction is not acceptable. */
Deck.initialize().then(boot).catch(err => { console.warn('Reveal init warning:', err); boot(); });

})();
</script>
